name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# tree-sitter requires CGO, so each target is built natively on its own runner
# instead of cross-compiling.
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Web UI
        shell: bash
        run: |
          cd web && npm ci && npm run build
          cd ..
          rm -rf internal/webui/dist
          mkdir -p internal/webui/dist
          cp -R web/dist/. internal/webui/dist/
          printf 'Built by CI\n' > internal/webui/dist/README
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          CGO_ENABLED=1 go build -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o "dist/gatt-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" ./cmd/gatt
      - uses: actions/upload-artifact@v4
        with:
          name: gatt-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum gatt-* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gatt-*
            dist/checksums.txt
          generate_release_notes: true

  npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/npm-publish.mjs "${GITHUB_REF_NAME#v}"

  docker:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: system4us/gatt
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sync Docker Hub README
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -f docs/dockerhub.md ]; then
            LOGIN_JSON=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{username:$u,password:$p}')
            HUB_JWT=$(curl -fsSL -X POST "https://hub.docker.com/v2/users/login/" -H "Content-Type: application/json" -d "$LOGIN_JSON" | jq -r '.token // empty' || true)
            if [ -n "$HUB_JWT" ]; then
              jq -Rs '{full_description: .}' docs/dockerhub.md | \
                curl -fsSL -X PATCH "https://hub.docker.com/v2/repositories/system4us/gatt/" \
                  -H "Authorization: Bearer ${HUB_JWT}" \
                  -H "Content-Type: application/json" \
                  -d @- >/dev/null || echo "warning: could not update Docker Hub README"
            else
              echo "warning: Docker Hub API login failed; skipped README sync"
            fi
          fi
